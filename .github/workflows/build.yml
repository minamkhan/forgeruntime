# Builds ForgeRuntime and publishes it to GitHub Container Registry (public, free).
# Runs on every push to main and on demand (Actions > Build ForgeRuntime > Run workflow).
name: Build ForgeRuntime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The image is ~9 GB; the stock runner has ~14 GB free. Remove preinstalled toolchains we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: echo "version=$(grep -oP 'FORGERUNTIME_VERSION=\K[0-9.]+' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forgeruntime:${{ steps.v.outputs.version }}-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/forgeruntime:voice-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ForgeRuntime: pinned GPU runtime for CineForge (voice v0)
            org.opencontainers.image.licenses=MIT

      - name: Digest
        run: echo "ghcr.io/${{ github.repository_owner }}/forgeruntime@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
